[package]
name = "yapfast-vst"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "VST2 and VST3 effects on Yapfast's microphone"

[lints]
workspace = true

[dependencies]
serde.workspace = true

# The plugins themselves load only on Windows, where their editors open in
# windows of their own.
[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A plugin's saved state in voice-effects.json.
base64 = "0.22"
# The VST 3 API's interfaces, generated from Steinberg's headers (MIT since
# VST 3.8), with what implementing them from Rust takes.
vst3 = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "vst-probe"
path = "examples/probe.rs"
