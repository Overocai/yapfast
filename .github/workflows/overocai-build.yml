# Builds this branch's Windows ZIP and Linux AppImage on every push to it, as
# nightly.yml's windows and linux jobs do, without the release, its signing
# or the Arch package: they're the run's artifacts (Actions > the run >
# Artifacts > windows, linux). Beside them, Clippy checks the workspace and
# the unit tests of the code the branch changes run on Linux.
#
# A build checks keys with the key server the YAPFAST_KEYS_URL variable names
# (Settings > Secrets and variables > Actions > Variables), or the one a run
# started by hand names; without one, it opens without a key. The Windows ZIP
# carries the build's source code beside yapfast.exe (SOURCE.txt).
name: Overocai build

on:
  push:
    branches: [overocai]
  workflow_dispatch:
    inputs:
      keys_url:
        description: "Key server this build checks keys with (empty: the YAPFAST_KEYS_URL variable)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: overocai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # The MSVC CRT and Windows SDK cargo-xwin downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-${{ hashFiles('nix/flake.lock') }}
      # Before scripts/set-version, which changes Cargo.lock, so the key
      # changes only with the dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Above 0.4.1, so the updater offers only a newer stable release.
      - run: scripts/set-version "0.5.0-overocai.${{ github.run_number }}"
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer --bundle-source
        env:
          YAPFAST_KEYS_URL: ${{ inputs.keys_url || vars.YAPFAST_KEYS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  linux:
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "0.5.0-overocai.${{ github.run_number }}"
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
        env:
          YAPFAST_KEYS_URL: ${{ inputs.keys_url || vars.YAPFAST_KEYS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/linux/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Formatting
        run: nix develop path:./nix --command cargo fmt --all -- --check
      - name: Clippy
        run: nix develop path:./nix --command cargo clippy --locked --profile fast --workspace --all-targets -- -D warnings
      - name: The unit tests of what the branch changes
        run: |
          nix develop path:./nix --command cargo test --locked --profile fast -p yapfast-discord --lib -- voice::tests:: call_connection::tests:: stream_connection::tests:: keywords::tests:: unread::tests::
          nix develop path:./nix --command cargo test --locked --profile fast -p yapfast-core --lib -- discord_audio::tests:: keybinds::tests:: own_profile::tests:: application::tests::profile_editor application::tests::media application::tests::timeline voice_message::tests::
          nix develop path:./nix --command cargo test --locked --profile fast -p yapfast-iced-kit --lib -- pan::tests::
          nix develop path:./nix --command cargo test --locked --profile fast -p yapfast-vst
      - name: The key server's tests
        run: python3 keys/test_yapfast_keys.py
